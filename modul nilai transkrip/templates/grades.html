<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nilai Mahasiswa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Nilai untuk {{ student.name }} ({{ student.id }})</h1>
        </header>

        <div class="actions">
            <a href="/add_grade/{{ student.id }}">Tambah Nilai</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Course ID</th>
                    <th>Grade</th>
                    <th>Updated At</th>
                </tr>
            </thead>
            <tbody>
                {% for grade in grades %}
                <tr>
                    <td>{{ grade.course_id }}</td>
                    <td>{{ grade.grade }}</td>
                    <td>{{ grade.updated_at }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="actions">
            <a href="/students">Kembali ke Daftar Mahasiswa</a>
        </div>
    </div>
</body>
</html>
