<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate PDF Transkrip</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Generate PDF Transkrip</h1>
        </header>

        <form method="post">
            <h3>Biodata Mahasiswa</h3>
            <div class="form-group">
                <label for="nim">NIM:</label>
                <input type="text" id="nim" name="nim" placeholder="12345678" required>
            </div>
            <div class="form-group">
                <label for="nama">Nama:</label>
                <input type="text" id="nama" name="nama" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label for="prodi">Program Studi:</label>
                <input type="text" id="prodi" name="prodi" placeholder="Teknik Informatika" required>
            </div>
            <div class="form-group">
                <label for="angkatan">Angkatan:</label>
                <input type="text" id="angkatan" name="angkatan" placeholder="2020" required>
            </div>
            <div class="form-group">
                <label for="total_sks">Total SKS:</label>
                <input type="number" id="total_sks" name="total_sks" placeholder="120" required>
            </div>
            <div class="form-group">
                <label for="ipk">IPK:</label>
                <input type="number" id="ipk" name="ipk" step="0.01" placeholder="3.75" required>
            </div>
            <div class="form-group">
                <label for="predikat">Predikat:</label>
                <input type="text" id="predikat" name="predikat" placeholder="Cum Laude" required>
            </div>

            <h3>Mata Kuliah (Semester 1)</h3>
            <table>
                <thead>
                    <tr>
                        <th>Kode</th>
                        <th>Nama</th>
                        <th>SKS</th>
                        <th>Nilai</th>
                        <th>Mutu</th>
                    </tr>
                </thead>
                <tbody>
                    {% for i in range(1, 6) %}
                    <tr>
                        <td><input type="text" name="mk_kode_{{ i }}" placeholder="TI101"></td>
                        <td><input type="text" name="mk_nama_{{ i }}" placeholder="Pemrograman Dasar"></td>
                        <td><input type="number" name="mk_sks_{{ i }}" placeholder="3"></td>
                        <td><input type="text" name="mk_nilai_{{ i }}" placeholder="A"></td>
                        <td><input type="number" name="mk_mutu_{{ i }}" step="0.01" placeholder="12.0"></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            <button type="submit">Generate PDF</button>
        </form>

        <div class="actions">
            <a href="/">Kembali ke Home</a>
        </div>
    </div>
</body>
</html>
